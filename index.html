<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routine Tracker 🔆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-soft: #F2E3E8;
            --border-grid: #EFEFEF;
            
            /* Quiet Luxury Palette */
            --header-pink-start: #FEE1E7;
            --header-pink-end: #F2D3E2;
            --accent-pink: #E25A91;
            --notion-blue: #2383E2;
            
            --text-dark: #382A2E;
            --text-muted: #8F7E84;
            --btn-dark: #2B2325;
            
            --shadow-subtle: 0 6px 20px rgba(180, 140, 150, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            background-color: transparent;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .widget-container {
            width: 100%;
            max-width: 950px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: var(--shadow-subtle);
            position: relative;
            overflow: hidden;
        }

        /* Header Banner matching screenshot */
        .header-banner {
            background: linear-gradient(135deg, var(--header-pink-start), var(--header-pink-end));
            padding: 10px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 10px;
            box-shadow: 0 2px 10px rgba(226, 90, 145, 0.12);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: normal;
            letter-spacing: 2px;
            color: var(--text-dark);
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Toolbar Controls */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-toolbar {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 4px 10px;
            font-family: 'Alice', serif;
            font-size: 0.74rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-toolbar:hover {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
            transform: translateY(-1px);
        }

        .btn-toolbar.active {
            background: var(--accent-pink);
            color: #ffffff;
            border-color: var(--accent-pink);
        }

        /* Table & Scroll Area */
        .tracker-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-grid);
            border-radius: 10px;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        .tracker-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }

        .tracker-table th, 
        .tracker-table td {
            border-bottom: 1px solid var(--border-grid);
            border-right: 1px solid var(--border-grid);
            padding: 6px 8px;
            text-align: center;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        /* Sticky Left Column (Habit Names) */
        .sticky-col {
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 10;
            text-align: left !important;
            min-width: 150px;
            max-width: 180px;
            box-shadow: 2px 0 6px rgba(0,0,0,0.03);
        }

        th.sticky-col {
            background: #FAF8F9;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* Header Days */
        .day-header {
            min-width: 30px;
            color: var(--text-muted);
            font-size: 0.72rem;
            background: #FAF8F9;
        }

        /* Compact Percentage Column */
        .progress-header {
            min-width: 45px;
            color: var(--accent-pink);
            font-weight: bold;
            background: #FAF8F9;
        }

        .progress-cell {
            font-weight: bold;
            color: var(--accent-pink);
            background: #FFFDFE;
            font-size: 0.75rem;
        }

        /* Current Day Highlight */
        .is-today {
            background-color: rgba(226, 90, 145, 0.08) !important;
        }

        .is-today-header {
            background-color: var(--accent-pink) !important;
            color: #ffffff !important;
            font-weight: bold;
        }

        /* Hide Past Columns when active */
        .hide-past .past-day {
            display: none !important;
        }

        /* Checkbox Styling */
        .checkbox-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 16px;
            height: 16px;
            border: 1.5px solid #D1C7CC;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            background: #ffffff;
        }

        .checkbox-container input {
            display: none;
        }

        .checkbox-container input:checked + .custom-checkbox {
            background-color: var(--notion-blue);
            border-color: var(--notion-blue);
        }

        .checkbox-container input:checked + .custom-checkbox::after {
            content: "✓";
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
        }

        .habit-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .habit-label {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-delete-row {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.15s;
        }

        tr:hover .btn-delete-row {
            opacity: 1;
        }

        .btn-delete-row:hover {
            color: #C62828;
        }

        /* Footer Controls */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 4px;
        }

        .btn-action-text {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Alice', serif;
            font-size: 0.72rem;
            cursor: pointer;
            transition: color 0.15s;
        }

        .btn-action-text:hover {
            color: var(--accent-pink);
        }

        /* Add Habit Input Box */
        .add-habit-box {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .input-habit {
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            padding: 4px 8px;
            font-family: 'Alice', serif;
            font-size: 0.75rem;
            outline: none;
            width: 140px;
        }

        .input-habit:focus {
            border-color: var(--accent-pink);
        }

        /* Scrollbar Styling */
        .tracker-scroll-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .tracker-scroll-wrapper::-webkit-scrollbar-thumb {
            background: #E8CCD5;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <!-- Header Banner -->
    <div class="header-banner">
        <span class="header-title">🔆 DAILY ROUTINE</span>
    </div>

    <!-- Toolbar Controls -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="btn-toolbar" id="btnHidePast" onclick="toggleHidePast()">👁️ Hide Past Days</button>
            <button class="btn-toolbar" onclick="scrollToToday()">📍 Jump to Today</button>
        </div>
        <div class="toolbar-group">
            <span style="font-size: 0.72rem; color: var(--text-muted);">Active Day:</span>
            <select id="daySelect" class="btn-toolbar" onchange="changeActiveDay(this.value)"></select>
        </div>
    </div>

    <!-- Tracker Matrix -->
    <div class="tracker-scroll-wrapper" id="scrollWrapper">
        <table class="tracker-table" id="trackerTable">
            <thead>
                <tr id="tableHeader">
                    <th class="sticky-col">Aa Name</th>
                    <!-- Days 1-31 & % column dynamically injected -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Habit rows dynamically injected -->
            </tbody>
        </table>
    </div>

    <!-- Footer Actions -->
    <div class="footer-bar">
        <div class="add-habit-box">
            <input type="text" class="input-habit" id="newHabitInput" placeholder="+ New habit..." onkeydown="handleKeyPress(event)">
            <button class="btn-toolbar" onclick="addNewHabit()">Add</button>
        </div>
        <button class="btn-action-text" onclick="resetMonth()">🔄 reset month</button>
    </div>
</div>

<script>
    const defaultHabits = [
        { id: 1, icon: "💊", name: "vitamins" },
        { id: 2, name: "hair ritual" },
        { id: 3, icon: "💆‍♀️", name: "guasha" },
        { id: 4, icon: "📋", name: "task 1+3" },
        { id: 5, icon: "🎯", name: "MY MAIN GOAL" },
        { id: 6, icon: "📹", name: "youtube" },
        { id: 7, icon: "🌐", name: "razu la" },
        { id: 8, icon: "🔆", name: "Pinterest" },
        { id: 9, icon: "🤸‍♀️", name: "stretching" },
        { id: 10, icon: "📖", name: "reading" }
    ];

    function safeLoadData() {
        try {
            const storedHabits = localStorage.getItem('routine_habits_31');
            const storedChecks = localStorage.getItem('routine_checks_31');
            return {
                habits: storedHabits ? JSON.parse(storedHabits) : defaultHabits,
                checks: storedChecks ? JSON.parse(storedChecks) : {}
            };
        } catch (e) {
            console.warn("LocalStorage restricted, using memory fallback.", e);
            return { habits: defaultHabits, checks: {} };
        }
    }

    function safeSaveData() {
        try {
            localStorage.setItem('routine_habits_31', JSON.stringify(habits));
            localStorage.setItem('routine_checks_31', JSON.stringify(checks));
        } catch (e) {
            console.warn("Unable to save to localStorage.", e);
        }
    }

    const loadedData = safeLoadData();
    let habits = loadedData.habits;
    let checks = loadedData.checks; // Format: { "habitId_day": true }

    const todayDate = new Date().getDate(); // Current Day 1-31
    let activeDay = todayDate;
    let hidePast = false;

    function initDaySelector() {
        const select = document.getElementById('daySelect');
        select.innerHTML = '';
        for (let i = 1; i <= 31; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `Day ${i}${i === todayDate ? ' (Today)' : ''}`;
            if (i === activeDay) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function renderTracker() {
        const headerTr = document.getElementById('tableHeader');
        const bodyTbody = document.getElementById('tableBody');
        const table = document.getElementById('trackerTable');

        // Toggle Hide Past Class
        if (hidePast) {
            table.classList.add('hide-past');
        } else {
            table.classList.remove('hide-past');
        }

        // Render Headers (Days 1 to 31)
        headerTr.innerHTML = '<th class="sticky-col">Aa Name</th>';
        for (let day = 1; day <= 31; day++) {
            const th = document.createElement('th');
            let classes = 'day-header';
            if (day < activeDay) classes += ' past-day';
            if (day === activeDay) classes += ' is-today-header';
            
            th.className = classes;
            th.id = `col_header_${day}`;
            th.innerHTML = `✓ ${day}`;
            headerTr.appendChild(th);
        }

        // Render Percentage Column Header
        const thPct = document.createElement('th');
        thPct.className = 'progress-header';
        thPct.innerText = '%';
        headerTr.appendChild(thPct);

        // Render Habit Rows
        bodyTbody.innerHTML = '';
        habits.forEach((habit) => {
            const tr = document.createElement('tr');

            // Sticky Left Habit Column
            const tdSticky = document.createElement('td');
            tdSticky.className = 'sticky-col';
            tdSticky.innerHTML = `
                <div class="habit-name">
                    <span class="habit-label">${habit.icon ? habit.icon + ' ' : ''}${habit.name}</span>
                    <button class="btn-delete-row" onclick="deleteHabit(${habit.id})" title="Delete habit">✕</button>
                </div>
            `;
            tr.appendChild(tdSticky);

            let checkedCount = 0;

            // Checkboxes 1 to 31
            for (let day = 1; day <= 31; day++) {
                const td = document.createElement('td');
                let classes = '';
                if (day < activeDay) classes += ' past-day';
                if (day === activeDay) classes += ' is-today';
                td.className = classes;
                td.id = `cell_${habit.id}_${day}`;

                const key = `${habit.id}_${day}`;
                const isChecked = !!checks[key];
                if (isChecked) checkedCount++;

                td.innerHTML = `
                    <label class="checkbox-container">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck(${habit.id}, ${day}, this.checked)">
                        <span class="custom-checkbox"></span>
                    </label>
                `;
                tr.appendChild(td);
            }

            // Compact Percentage Cell at End of Task Row
            const pct = Math.round((checkedCount / 31) * 100);
            const tdPct = document.createElement('td');
            tdPct.className = 'progress-cell';
            tdPct.id = `pct_${habit.id}`;
            tdPct.innerText = `${pct}%`;
            tr.appendChild(tdPct);

            bodyTbody.appendChild(tr);
        });
    }

    function toggleCheck(habitId, day, isChecked) {
        const key = `${habitId}_${day}`;
        checks[key] = isChecked;
        safeSaveData();
        updateHabitPct(habitId);
    }

    function updateHabitPct(habitId) {
        let checkedCount = 0;
        for (let day = 1; day <= 31; day++) {
            if (checks[`${habitId}_${day}`]) checkedCount++;
        }
        const pct = Math.round((checkedCount / 31) * 100);
        const pctCell = document.getElementById(`pct_${habitId}`);
        if (pctCell) pctCell.innerText = `${pct}%`;
    }

    function changeActiveDay(newDay) {
        activeDay = parseInt(newDay, 10);
        renderTracker();
        scrollToToday();
    }

    function toggleHidePast() {
        hidePast = !hidePast;
        const btn = document.getElementById('btnHidePast');
        if (hidePast) {
            btn.classList.add('active');
            btn.innerText = '👁️ Show All Days';
        } else {
            btn.classList.remove('active');
            btn.innerText = '👁️ Hide Past Days';
        }
        renderTracker();
    }

    function scrollToToday() {
        const targetCol = document.getElementById(`col_header_${activeDay}`);
        const wrapper = document.getElementById('scrollWrapper');
        if (targetCol && wrapper) {
            const offsetLeft = targetCol.offsetLeft - 160; // offset for sticky column
            wrapper.scrollTo({ left: Math.max(0, offsetLeft), behavior: 'smooth' });
        }
    }

    function addNewHabit() {
        const input = document.getElementById('newHabitInput');
        const text = input.value.trim();
        if (!text) return;

        habits.push({
            id: Date.now(),
            name: text
        });

        input.value = '';
        safeSaveData();
        renderTracker();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') addNewHabit();
    }

    function deleteHabit(id) {
        habits = habits.filter(h => h.id !== id);
        safeSaveData();
        renderTracker();
    }

    function resetMonth() {
        if (confirm("Reset all habit checkboxes for this month?")) {
            checks = {};
            safeSaveData();
            renderTracker();
        }
    }

    function initWidget() {
        initDaySelector();
        renderTracker();
        setTimeout(scrollToToday, 200); // Smooth scroll to today on load
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initWidget);
    } else {
        initWidget();
    }
</script>

</body>
</html>
