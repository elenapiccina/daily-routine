<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routine Tracker 🔆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-soft: #F2E3E8;
            --border-grid: #EFEFEF;
            
            /* Quiet Luxury Palette */
            --header-pink-start: #FEE1E7;
            --header-pink-end: #F2D3E2;
            --accent-pink: #E25A91;
            --notion-blue: #2383E2;
            
            --text-dark: #382A2E;
            --text-muted: #8F7E84;
            --btn-dark: #2B2325;
            
            --shadow-subtle: 0 6px 20px rgba(180, 140, 150, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            background-color: transparent;
            padding: 12px 8px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .widget-container {
            width: 100%;
            max-width: 980px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: var(--shadow-subtle);
            position: relative;
            overflow: hidden;
        }

        /* Header Banner */
        .header-banner {
            background: linear-gradient(135deg, var(--header-pink-start), var(--header-pink-end));
            padding: 10px 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px rgba(226, 90, 145, 0.12);
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: normal;
            letter-spacing: 2px;
            color: var(--text-dark);
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Toolbar Controls */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-toolbar {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 5px 12px;
            font-family: 'Alice', serif;
            font-size: 0.76rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-toolbar:hover {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
            transform: translateY(-1px);
        }

        .btn-toolbar.active {
            background: var(--accent-pink);
            color: #ffffff;
            border-color: var(--accent-pink);
        }

        /* Table & Scroll Area */
        .tracker-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-grid);
            border-radius: 10px;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        .tracker-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }

        .tracker-table th, 
        .tracker-table td {
            border-bottom: 1px solid var(--border-grid);
            border-right: 1px solid var(--border-grid);
            padding: 6px 8px;
            text-align: center;
            font-size: 0.78rem;
            white-space: nowrap;
        }

        /* Sticky Left Column (Habit Names) */
        .sticky-col {
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 10;
            text-align: left !important;
            min-width: 190px;
            max-width: 230px;
            box-shadow: 2px 0 6px rgba(0,0,0,0.03);
        }

        th.sticky-col {
            background: #FAF8F9;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* Drag and Drop Visual Indicators */
        tr.draggable-row {
            cursor: grab;
            transition: background-color 0.15s ease;
        }

        tr.draggable-row:active {
            cursor: grabbing;
        }

        tr.dragging {
            opacity: 0.4;
            background-color: #FAF2F5 !important;
        }

        tr.drag-over {
            border-top: 2px solid var(--accent-pink) !important;
            background-color: rgba(226, 90, 145, 0.05);
        }

        .drag-handle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 2px 4px;
            margin-right: 4px;
            cursor: grab;
            user-select: none;
            opacity: 0.4;
            transition: opacity 0.15s ease, color 0.15s ease;
        }

        tr:hover .drag-handle {
            opacity: 0.85;
            color: var(--accent-pink);
        }

        /* Header Days */
        .day-header {
            min-width: 30px;
            color: var(--text-muted);
            font-size: 0.72rem;
            background: #FAF8F9;
        }

        /* Compact Percentage Column */
        .progress-header {
            min-width: 48px;
            color: var(--accent-pink);
            font-weight: bold;
            background: #FAF8F9;
        }

        .progress-cell {
            font-weight: bold;
            color: var(--accent-pink);
            background: #FFFDFE;
            font-size: 0.75rem;
        }

        /* Current Day Highlight */
        .is-today {
            background-color: rgba(226, 90, 145, 0.08) !important;
        }

        .is-today-header {
            background-color: var(--accent-pink) !important;
            color: #ffffff !important;
            font-weight: bold;
        }

        /* Hide Past Columns when active */
        .hide-past .past-day {
            display: none !important;
        }

        /* Checkbox Styling */
        .checkbox-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 2px;
        }

        .custom-checkbox {
            width: 17px;
            height: 17px;
            border: 1.5px solid #D1C7CC;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #ffffff;
        }

        .checkbox-container input {
            display: none;
        }

        .checkbox-container input:checked + .custom-checkbox {
            background-color: var(--notion-blue);
            border-color: var(--notion-blue);
            transform: scale(1.1);
        }

        .checkbox-container input:checked + .custom-checkbox::after {
            content: "✓";
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
        }

        .habit-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            width: 100%;
        }

        .habit-label {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            cursor: pointer;
            border-radius: 4px;
            padding: 2px 4px;
            transition: background 0.15s ease;
            user-select: none;
        }

        .habit-label:hover {
            background-color: rgba(226, 90, 145, 0.08);
            color: var(--accent-pink);
        }

        .habit-actions {
            display: flex;
            align-items: center;
        }

        .btn-icon-action {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 4px;
            opacity: 0.3;
            transition: all 0.15s ease;
            line-height: 1;
        }

        tr:hover .btn-icon-action {
            opacity: 1;
        }

        .btn-icon-action:hover {
            color: #C62828 !important;
            transform: scale(1.15);
        }

        /* Footer Controls */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 4px;
        }

        .btn-action-text {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Alice', serif;
            font-size: 0.72rem;
            cursor: pointer;
            transition: color 0.15s;
        }

        .btn-action-text:hover {
            color: var(--accent-pink);
        }

        /* Add Habit Input Box */
        .add-habit-box {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .input-habit {
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            padding: 5px 8px;
            font-family: 'Alice', serif;
            font-size: 0.75rem;
            outline: none;
            width: 150px;
        }

        .input-habit:focus {
            border-color: var(--accent-pink);
        }

        /* Custom Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(56, 42, 46, 0.25);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 16px 20px;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            font-family: 'Alice', serif;
        }

        .modal-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .modal-body {
            font-size: 0.8rem;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .modal-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .modal-input {
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            padding: 5px 8px;
            font-family: 'Alice', serif;
            font-size: 0.78rem;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--accent-pink);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }

        /* Scrollbar Styling */
        .tracker-scroll-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .tracker-scroll-wrapper::-webkit-scrollbar-thumb {
            background: #E8CCD5;
            border-radius: 4px;
        }

        /* Canvas Overlay for Confetti */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- Fullscreen Canvas for Particle Confetti Animation -->
<canvas id="confettiCanvas"></canvas>

<div class="widget-container">
    <!-- Header Banner -->
    <div class="header-banner">
        <span class="header-title">份 DAILY ROUTINE</span>
    </div>

    <!-- Toolbar Controls -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="btn-toolbar" id="btnHidePast" onclick="toggleHidePast()">👁️ Hide Past Days</button>
            <button class="btn-toolbar" onclick="scrollToToday()">📍 Jump to Today</button>
        </div>
        <div class="toolbar-group">
            <span style="font-size: 0.72rem; color: var(--text-muted);">Active Day:</span>
            <select id="daySelect" class="btn-toolbar" onchange="changeActiveDay(this.value)"></select>
        </div>
    </div>

    <!-- Tracker Matrix -->
    <div class="tracker-scroll-wrapper" id="scrollWrapper">
        <table class="tracker-table" id="trackerTable">
            <thead>
                <tr id="tableHeader">
                    <th class="sticky-col">Aa Name</th>
                    <!-- Days 1-31 & % column dynamically injected -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Habit rows dynamically injected -->
            </tbody>
        </table>
    </div>

    <!-- Footer Actions -->
    <div class="footer-bar">
        <div class="add-habit-box">
            <input type="text" class="input-habit" id="newHabitInput" placeholder="+ New habit..." onkeydown="handleKeyPress(event)">
            <button class="btn-toolbar" onclick="addNewHabit()">Add</button>
        </div>
        <button class="btn-action-text" onclick="confirmResetMonth()">🔄 reset month</button>
    </div>
</div>

<!-- Custom Modal for Confirm & Edit -->
<div id="customModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <div class="modal-title" id="modalTitle">Modal Title</div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<script>
    const defaultHabits = [
        { id: 1, icon: "💊", name: "vitamins" },
        { id: 2, icon: "🧼", name: "hair routine" },
        { id: 3, icon: "💆‍♀️", name: "guasha" },
        { id: 4, icon: "📋", name: "task 1+3" },
        { id: 5, icon: "🎯", name: "MY MAIN GOAL" },
        { id: 6, icon: "📹", name: "youtube" },
        { id: 7, icon: "🌐", name: "razu la" },
        { id: 8, icon: "🔆", name: "Pinterest" },
        { id: 9, icon: "🤸‍♀️", name: "stretching" },
        { id: 10, icon: "📖", name: "reading" }
    ];

    function safeLoadData() {
        try {
            const storedHabits = localStorage.getItem('routine_habits_31');
            const storedChecks = localStorage.getItem('routine_checks_31');
            let loadedHabits = storedHabits ? JSON.parse(storedHabits) : defaultHabits;
            
            loadedHabits = loadedHabits.map(h => {
                if (h.name === "hair ritual" || (h.id === 2 && h.name.includes("hair"))) {
                    return { ...h, icon: "🧼", name: "hair routine" };
                }
                return h;
            });

            return {
                habits: loadedHabits,
                checks: storedChecks ? JSON.parse(storedChecks) : {}
            };
        } catch (e) {
            console.warn("LocalStorage restricted, using memory fallback.", e);
            return { habits: defaultHabits, checks: {} };
        }
    }

    function safeSaveData() {
        try {
            localStorage.setItem('routine_habits_31', JSON.stringify(habits));
            localStorage.setItem('routine_checks_31', JSON.stringify(checks));
        } catch (e) {
            console.warn("Unable to save to localStorage.", e);
        }
    }

    const loadedData = safeLoadData();
    let habits = loadedData.habits;
    let checks = loadedData.checks;

    const todayDate = new Date().getDate();
    let activeDay = todayDate;
    let hidePast = false;
    let draggedIndex = null;

    // Self-contained pastel particle confetti animation
    const confettiCanvas = document.getElementById('confettiCanvas');
    const ctx = confettiCanvas.getContext('2d');
    let particles = [];
    let animationFrameId = null;

    function resizeCanvas() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti(originX, originY) {
        const colors = ['#E25A91', '#2383E2', '#FEE1E7', '#FFB7C5', '#A8DADC', '#E0A96D', '#B388FF'];
        const numParticles = 45;

        for (let i = 0; i < numParticles; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 8 + 3;
            particles.push({
                x: originX,
                y: originY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2, // Slight upward boost
                size: Math.random() * 7 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.2,
                opacity: 1,
                life: 1,
                decay: Math.random() * 0.02 + 0.015,
                shape: Math.random() > 0.4 ? 'rect' : 'circle'
            });
        }

        if (!animationFrameId) {
            animateConfetti();
        }
    }

    function animateConfetti() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravity
            p.vx *= 0.98; // Air resistance
            p.rotation += p.vRot;
            p.life -= p.decay;

            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;

            if (p.shape === 'rect') {
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        if (particles.length > 0) {
            animationFrameId = requestAnimationFrame(animateConfetti);
        } else {
            animationFrameId = null;
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
    }

    function initDaySelector() {
        const select = document.getElementById('daySelect');
        select.innerHTML = '';
        for (let i = 1; i <= 31; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `Day ${i}${i === todayDate ? ' (Today)' : ''}`;
            if (i === activeDay) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function renderTracker() {
        const headerTr = document.getElementById('tableHeader');
        const bodyTbody = document.getElementById('tableBody');
        const table = document.getElementById('trackerTable');

        if (hidePast) {
            table.classList.add('hide-past');
        } else {
            table.classList.remove('hide-past');
        }

        headerTr.innerHTML = '<th class="sticky-col">Aa Name</th>';
        for (let day = 1; day <= 31; day++) {
            const th = document.createElement('th');
            let classes = 'day-header';
            if (day < activeDay) classes += ' past-day';
            if (day === activeDay) classes += ' is-today-header';
            
            th.className = classes;
            th.id = `col_header_${day}`;
            th.innerHTML = `✓ ${day}`;
            headerTr.appendChild(th);
        }

        const thPct = document.createElement('th');
        thPct.className = 'progress-header';
        thPct.innerText = '%';
        headerTr.appendChild(thPct);

        bodyTbody.innerHTML = '';
        
        habits.forEach((habit, index) => {
            const tr = document.createElement('tr');
            tr.className = 'draggable-row';
            tr.setAttribute('draggable', 'true');
            tr.setAttribute('data-index', index);

            // Drag and Drop Event Listeners
            tr.addEventListener('dragstart', (e) => {
                draggedIndex = index;
                tr.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
            });

            tr.addEventListener('dragend', () => {
                tr.classList.remove('dragging');
                document.querySelectorAll('.draggable-row').forEach(row => row.classList.remove('drag-over'));
            });

            tr.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const row = e.currentTarget;
                if (draggedIndex !== null && draggedIndex !== index) {
                    row.classList.add('drag-over');
                }
            });

            tr.addEventListener('dragleave', (e) => {
                e.currentTarget.classList.remove('drag-over');
            });

            tr.addEventListener('drop', (e) => {
                e.preventDefault();
                tr.classList.remove('drag-over');
                if (draggedIndex === null || draggedIndex === index) return;

                // Move item in array
                const movedHabit = habits.splice(draggedIndex, 1)[0];
                habits.splice(index, 0, movedHabit);

                draggedIndex = null;
                safeSaveData();
                renderTracker();
            });

            // Sticky Habit Column Content
            const tdSticky = document.createElement('td');
            tdSticky.className = 'sticky-col';
            tdSticky.innerHTML = `
                <div class="habit-name">
                    <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
                    <span class="habit-label" ondblclick="editHabit(${habit.id})" title="Double-click to edit name">
                        ${habit.icon ? habit.icon + ' ' : ''}${habit.name}
                    </span>
                    <div class="habit-actions">
                        <button class="btn-icon-action" onclick="deleteHabit(${habit.id})" title="Delete Habit">✕</button>
                    </div>
                </div>
            `;
            tr.appendChild(tdSticky);

            let checkedCount = 0;

            for (let day = 1; day <= 31; day++) {
                const td = document.createElement('td');
                let classes = '';
                if (day < activeDay) classes += ' past-day';
                if (day === activeDay) classes += ' is-today';
                td.className = classes;
                td.id = `cell_${habit.id}_${day}`;

                const key = `${habit.id}_${day}`;
                const isChecked = !!checks[key];
                if (isChecked) checkedCount++;

                td.innerHTML = `
                    <label class="checkbox-container">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="handleCheckChange(event, ${habit.id}, ${day})">
                        <span class="custom-checkbox"></span>
                    </label>
                `;
                tr.appendChild(td);
            }

            const pct = Math.round((checkedCount / 31) * 100);
            const tdPct = document.createElement('td');
            tdPct.className = 'progress-cell';
            tdPct.id = `pct_${habit.id}`;
            tdPct.innerText = `${pct}%`;
            tr.appendChild(tdPct);

            bodyTbody.appendChild(tr);
        });
    }

    function handleCheckChange(e, habitId, day) {
        const isChecked = e.target.checked;
        const key = `${habitId}_${day}`;
        checks[key] = isChecked;
        safeSaveData();
        updateHabitPct(habitId);

        if (isChecked) {
            // Get screen coordinates of the clicked checkbox for precise confetti explosion
            const rect = e.target.parentElement.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;
            triggerConfetti(originX, originY);
        }
    }

    function updateHabitPct(habitId) {
        let checkedCount = 0;
        for (let day = 1; day <= 31; day++) {
            if (checks[`${habitId}_${day}`]) checkedCount++;
        }
        const pct = Math.round((checkedCount / 31) * 100);
        const pctCell = document.getElementById(`pct_${habitId}`);
        if (pctCell) pctCell.innerText = `${pct}%`;
    }

    function changeActiveDay(newDay) {
        activeDay = parseInt(newDay, 10);
        renderTracker();
        scrollToToday();
    }

    function toggleHidePast() {
        hidePast = !hidePast;
        const btn = document.getElementById('btnHidePast');
        if (hidePast) {
            btn.classList.add('active');
            btn.innerText = '👁️ Show All Days';
        } else {
            btn.classList.remove('active');
            btn.innerText = '👁️ Hide Past Days';
        }
        renderTracker();
    }

    function scrollToToday() {
        const targetCol = document.getElementById(`col_header_${activeDay}`);
        const wrapper = document.getElementById('scrollWrapper');
        if (targetCol && wrapper) {
            const offsetLeft = targetCol.offsetLeft - 190;
            wrapper.scrollTo({ left: Math.max(0, offsetLeft), behavior: 'smooth' });
        }
    }

    function addNewHabit() {
        const input = document.getElementById('newHabitInput');
        const text = input.value.trim();
        if (!text) return;

        const emojiMatch = text.match(/^(\p{Extended_Pictographic}|\p{Emoji_Presentation})\s*(.*)$/u);
        let icon = "✨";
        let name = text;
        if (emojiMatch && emojiMatch[2]) {
            icon = emojiMatch[1];
            name = emojiMatch[2];
        }

        habits.push({
            id: Date.now(),
            icon: icon,
            name: name
        });

        input.value = '';
        safeSaveData();
        renderTracker();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') addNewHabit();
    }

    function deleteHabit(id) {
        habits = habits.filter(h => h.id !== id);
        safeSaveData();
        renderTracker();
    }

    function editHabit(id) {
        const habit = habits.find(h => h.id === id);
        if (!habit) return;

        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalActions = document.getElementById('modalActions');

        modalTitle.innerText = "Edit Habit";
        modalBody.innerHTML = `
            <div class="modal-input-group">
                <label style="font-size: 0.72rem; color: var(--text-muted);">Icon (Emoji):</label>
                <input type="text" id="editIconInput" class="modal-input" value="${habit.icon || ''}" style="width: 60px;">
                <label style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;">Habit Name:</label>
                <input type="text" id="editNameInput" class="modal-input" value="${habit.name || ''}">
            </div>
        `;

        modalActions.innerHTML = `
            <button class="btn-toolbar" onclick="closeModal()">Cancel</button>
            <button class="btn-toolbar active" onclick="saveEditHabit(${id})">Save</button>
        `;

        document.getElementById('customModal').style.display = 'flex';
    }

    function saveEditHabit(id) {
        const iconVal = document.getElementById('editIconInput').value.trim();
        const nameVal = document.getElementById('editNameInput').value.trim();
        
        const habit = habits.find(h => h.id === id);
        if (habit) {
            habit.icon = iconVal;
            habit.name = nameVal || habit.name;
            safeSaveData();
            renderTracker();
        }
        closeModal();
    }

    function confirmResetMonth() {
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalActions = document.getElementById('modalActions');

        modalTitle.innerText = "Reset Month";
        modalBody.innerText = "Are you sure you want to clear all habit checkboxes for this month?";

        modalActions.innerHTML = `
            <button class="btn-toolbar" onclick="closeModal()">Cancel</button>
            <button class="btn-toolbar active" onclick="executeResetMonth()">Reset</button>
        `;

        document.getElementById('customModal').style.display = 'flex';
    }

    function executeResetMonth() {
        checks = {};
        safeSaveData();
        renderTracker();
        closeModal();
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    function initWidget() {
        initDaySelector();
        renderTracker();
        setTimeout(scrollToToday, 200);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initWidget);
    } else {
        initWidget();
    }
</script>

</body>
</html>
