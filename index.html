<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routine Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        :root {
            --banner-bg: #F8D2E3;
            --card-bg: #FFFFFF;
            --border-color: #F2D3E0;
            --text-main: #5E6168;
            --text-muted: #A0A3AA;
            --accent-pink: #E89FB8;
            --active-day-bg: #D88EA5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            background-color: transparent;
            padding: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .tracker-card {
            width: 100%;
            max-width: 950px;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(230, 180, 200, 0.12);
        }

        /* Banner Header */
        .banner {
            background-color: var(--banner-bg);
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .banner-title {
            font-size: 1.25rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #5E6168;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Control Toolbar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #FFFFFF;
            border-bottom: 1px solid #FDF0F5;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-pill {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 14px;
            font-family: 'Alice', serif;
            font-size: 0.88rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pill:hover {
            background: #FFF0F5;
        }

        .active-day-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .dropdown-pill {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 12px;
            font-family: 'Alice', serif;
            font-size: 0.88rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        /* Table Area */
        .table-container {
            overflow-x: auto;
            padding: 10px 15px;
            scroll-behavior: smooth;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        th, td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid #FDF0F5;
            white-space: nowrap;
        }

        th {
            font-weight: normal;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        th.habit-col, td.habit-col {
            text-align: left;
            padding-left: 12px;
            min-width: 160px;
            font-weight: 500;
            position: relative;
        }

        /* Delete cross icon on habit row hover */
        .delete-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #C0BAC0;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }

        tr:hover .delete-btn {
            display: inline-block;
        }

        .delete-btn:hover {
            color: var(--active-day-bg);
        }

        /* Active Day Highlight */
        .active-day-pill {
            background: var(--active-day-bg);
            color: #FFFFFF !important;
            border-radius: 8px;
            padding: 3px 8px;
            font-weight: bold;
            display: inline-block;
        }

        /* Percentage Column */
        th.progress-col, td.progress-col {
            min-width: 55px;
            font-weight: bold;
            color: var(--active-day-bg);
            background: #FFF9FC;
        }

        /* Checkboxes */
        .custom-chk {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-pink);
            cursor: pointer;
            border-radius: 4px;
        }

        /* Bottom Row - Add + Reset Month */
        .bottom-bar {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            border-top: 1px solid #FDF0F5;
        }

        .add-group {
            display: flex;
            gap: 8px;
        }

        .add-input {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 14px;
            font-family: 'Alice', serif;
            font-size: 0.88rem;
            outline: none;
            width: 180px;
            color: var(--text-main);
        }

        .reset-btn {
            background: transparent;
            border: none;
            font-family: 'Alice', serif;
            font-size: 0.88rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s ease;
        }

        .reset-btn:hover {
            color: var(--active-day-bg);
        }
    </style>
</head>
<body>

<div class="tracker-card">
    <!-- Header Banner -->
    <div class="banner">
        <div class="banner-title">🔆 DAILY ROUTINE</div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <div class="btn-group">
            <button class="btn-pill" onclick="toggleHidePast()">
                <span id="hideIcon">👁️</span> <span id="hideText">Hide Past Days</span>
            </button>
            <button class="btn-pill" onclick="jumpToToday()">📍 Jump to Today</button>
        </div>

        <div class="active-day-wrap">
            <span>Active Day:</span>
            <select id="activeDaySelect" class="dropdown-pill" onchange="setActiveDay(this.value)">
                <!-- JS Populated 1..31 -->
            </select>
        </div>
    </div>

    <!-- Table Container -->
    <div class="table-container" id="tableContainer">
        <table>
            <thead>
                <tr id="headerRow">
                    <!-- JS Populated -->
                </tr>
            </thead>
            <tbody id="habitBody">
                <!-- JS Populated -->
            </tbody>
        </table>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <div class="add-group">
            <input type="text" id="newHabitInput" class="add-input" placeholder="+ New habit..." onkeypress="if(event.key==='Enter') addHabit()">
            <button class="btn-pill" onclick="addHabit()">Add</button>
        </div>
        <button class="reset-btn" onclick="resetMonth()">🔄 reset month</button>
    </div>
</div>

<script>
    const totalDays = 31;
    const defaultHabits = [
        "💊 vitamins",
        "hair ritual",
        "💆‍♀️ guasha",
        "📋 task 1+3",
        "🎯 MY MAIN GOAL",
        "📹 youtube",
        "🌐 razu la",
        "🔆 Pinterest",
        "🤸‍♀️ stretching",
        "📖 reading"
    ];

    let state = JSON.parse(localStorage.getItem('daily_routine_31days_exact_v4')) || {
        habits: defaultHabits,
        checks: {},
        activeDay: 13,
        hidePast: false
    };

    function initActiveDayDropdown() {
        const select = document.getElementById('activeDaySelect');
        select.innerHTML = '';
        for (let d = 1; d <= totalDays; d++) {
            const opt = document.createElement('option');
            opt.value = d;
            opt.innerText = `Day ${d}${d === state.activeDay ? ' (Today)' : ''}`;
            if (d === state.activeDay) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function renderTable() {
        const headerRow = document.getElementById('headerRow');
        const habitBody = document.getElementById('habitBody');

        // Header Row Generation
        let headerHTML = `<th class="habit-col">Aa Name</th>`;
        for (let d = 1; d <= totalDays; d++) {
            if (state.hidePast && d < state.activeDay) continue;
            
            if (d === state.activeDay) {
                headerHTML += `<th id="dayCol-${d}"><span class="active-day-pill">✓ ${d}</span></th>`;
            } else {
                headerHTML += `<th id="dayCol-${d}">✓ ${d}</th>`;
            }
        }
        headerHTML += `<th class="progress-col">%</th>`;
        headerRow.innerHTML = headerHTML;

        // Habit Rows Generation
        habitBody.innerHTML = '';
        state.habits.forEach((habit, hIdx) => {
            let habitCheckedCount = 0;
            let dayCells = '';

            for (let d = 1; d <= totalDays; d++) {
                const key = `${hIdx}-${d}`;
                const isChecked = !!state.checks[key];
                if (isChecked) habitCheckedCount++;

                if (state.hidePast && d < state.activeDay) continue;

                dayCells += `<td><input type="checkbox" class="custom-chk" ${isChecked ? 'checked' : ''} onchange="toggleCheck(${hIdx}, ${d})"></td>`;
            }

            const habitPct = Math.round((habitCheckedCount / totalDays) * 100);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="habit-col">
                    ${habit}
                    <span class="delete-btn" onclick="deleteHabit(${hIdx})">✕</span>
                </td>
                ${dayCells}
                <td class="progress-col">${habitPct}%</td>
            `;
            habitBody.appendChild(tr);
        });

        // Update UI button state
        document.getElementById('hideText').innerText = state.hidePast ? 'Show All Days' : 'Hide Past Days';
    }

    function toggleCheck(hIdx, day) {
        const key = `${hIdx}-${day}`;
        state.checks[key] = !state.checks[key];
        saveAndRender();
    }

    function addHabit() {
        const input = document.getElementById('newHabitInput');
        if (input.value.trim()) {
            state.habits.push(input.value.trim());
            input.value = '';
            saveAndRender();
        }
    }

    function deleteHabit(hIdx) {
        state.habits.splice(hIdx, 1);
        saveAndRender();
    }

    function setActiveDay(val) {
        state.activeDay = parseInt(val, 10);
        initActiveDayDropdown();
        saveAndRender();
    }

    function toggleHidePast() {
        state.hidePast = !state.hidePast;
        saveAndRender();
    }

    function jumpToToday() {
        const activeCol = document.getElementById(`dayCol-${state.activeDay}`);
        if (activeCol) {
            activeCol.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    }

    function resetMonth() {
        if (confirm("Are you sure you want to reset all checked items for this month?")) {
            state.checks = {};
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('daily_routine_31days_exact_v4', JSON.stringify(state));
        renderTable();
    }

    // Initial Execution
    initActiveDayDropdown();
    renderTable();
</script>

</body>
</html>
